services:
  redis:
    image: redis:8.10.1-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - connuoc-redis:/data

volumes:
  connuoc-redis:
