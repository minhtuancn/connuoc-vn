packages:
  - 'apps/web'
  - 'apps/admin'
  - 'services/*'
  - 'packages/*'

# Flutter mobile is intentionally outside the pnpm workspace.

# pnpm 11+ uses allowBuilds in the workspace manifest as the reviewed
# dependency lifecycle-script policy. Optional/telemetry native scripts stay
# disabled unless a measured runtime need justifies enabling them.
allowBuilds:
  '@scarf/scarf': false
  'msgpackr-extract': false
