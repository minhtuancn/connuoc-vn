name: Mobile bootstrap scaffold

on:
  push:
    branches:
      - phase-3/mobile-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold-and-red-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-3/mobile-bootstrap
          fetch-depth: 0

      - name: Setup Flutter 3.47.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Generate Android and iOS scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/connuoc_viet
          flutter create \
            --platforms=android,ios \
            --org vn.connuoc \
            --project-name connuoc_viet \
            /tmp/connuoc_viet
          rm -rf apps/mobile/android apps/mobile/ios
          cp -R /tmp/connuoc_viet/android apps/mobile/android
          cp -R /tmp/connuoc_viet/ios apps/mobile/ios
          cp /tmp/connuoc_viet/.metadata apps/mobile/.metadata
          cd apps/mobile
          flutter pub get
          flutter gen-l10n

      - name: Commit generated scaffold and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mobile/android apps/mobile/ios apps/mobile/.metadata apps/mobile/pubspec.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mobile): generate Flutter platform scaffold'
          git push origin HEAD:phase-3/mobile-bootstrap

      - name: Run bootstrap contract tests expecting RED
        working-directory: apps/mobile
        run: flutter test test/core/config/app_config_test.dart test/app/app_smoke_test.dart
