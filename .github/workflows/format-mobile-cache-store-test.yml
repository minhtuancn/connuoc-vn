name: Format mobile cache store test

on:
  push:
    branches:
      - phase-3/mobile-offline-persistence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-3/mobile-offline-persistence
          fetch-depth: 0

      - name: Setup Flutter 3.47.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Format cache store RED test
        run: dart format test/features/public_data/drift_public_data_cache_store_test.dart

      - name: Commit formatting
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mobile/test/features/public_data/drift_public_data_cache_store_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(mobile): format Drift cache store contract test'
          git push origin HEAD:phase-3/mobile-offline-persistence
