name: Sync Phase 5B lockfile

on:
  push:
    branches:
      - phase-5/weather-forecasts-active
    paths:
      - services/api/package.json
      - .github/workflows/sync-phase5b-lockfile.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-5/weather-forecasts-active
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): sync Phase 5B API dependency"
          git push origin HEAD:phase-5/weather-forecasts-active
