name: Update mobile lockfile

on:
  push:
    branches:
      - phase-3/mobile-offline-persistence

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-3/mobile-offline-persistence
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mobile/pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mobile): refresh Drift dependency lockfile'
          git push origin HEAD:phase-3/mobile-offline-persistence
