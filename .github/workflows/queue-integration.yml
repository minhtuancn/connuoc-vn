name: Queue Integration

on:
  pull_request:
    paths:
      - 'packages/job-queue/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/queue-integration.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/job-queue/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/queue-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis-smoke:
    name: Redis/BullMQ smoke
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build queue dependencies
        run: |
          pnpm --filter @connuoc/shared-types build
          pnpm --filter @connuoc/job-queue build

      - name: Verify Redis connectivity and deterministic duplicate enqueue
        run: node packages/job-queue/scripts/redis-smoke.mjs
