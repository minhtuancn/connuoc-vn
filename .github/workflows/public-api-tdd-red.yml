name: Public API TDD RED

on:
  push:
    branches:
      - phase-2/public-api

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @connuoc/api test -- public-data.service.test.ts
