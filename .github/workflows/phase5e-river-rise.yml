name: Phase 5E River Rise Calibration

on:
  pull_request:
    paths:
      - 'packages/shared-types/**'
      - 'services/api/**'
      - 'infrastructure/database/**'
      - 'docs/superpowers/plans/2026-09-18-phase5e-river-rise-calibration.md'
      - 'docs/PHASE-5E-RIVER-RISE.md'
      - 'docs/PROJECT-STATUS.md'
      - 'docs/ROADMAP.md'
      - 'pnpm-lock.yaml'
      - '.github/workflows/phase5e-river-rise.yml'

permissions:
  contents: read

jobs:
  phase5e:
    name: Datum/calibration/stage evidence gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: connuoc
          POSTGRES_DB: connuoc
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connuoc -d connuoc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://connuoc@localhost:5432/connuoc
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - name: Install workspace dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to fresh PostGIS database
        run: pnpm --filter @connuoc/api db:migrate
      - name: Verify Phase 5E schema and constraints
        run: pnpm --filter @connuoc/api db:smoke
      - name: Verify calibration contracts and rating-curve evaluator
        run: |
          pnpm --filter @connuoc/shared-types typecheck
          pnpm --filter @connuoc/shared-types test
          pnpm --filter @connuoc/shared-types build
      - name: Verify calibration API unit contracts
        run: |
          pnpm --filter @connuoc/api typecheck
          pnpm --filter @connuoc/api test
      - name: Verify repository activation rollback and persistence
        run: |
          pnpm --filter @connuoc/api exec vitest run             test/calibration.repository.integration.test.ts             test/phase5e-stage-api.integration.test.ts             --maxWorkers=1
      - name: Run full API integration regression suite
        run: pnpm --filter @connuoc/api test:integration
      - name: Build API
        run: pnpm --filter @connuoc/api build
