name: Generate pnpm lockfile

on:
  push:
    branches:
      - phase-1/completion-gate

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message != 'chore: generate pnpm lockfile'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: phase-1/completion-gate
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Generate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo 'pnpm-lock.yaml is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No lockfile change to commit.'
            exit 0
          fi
          git commit -m 'chore: generate pnpm lockfile'
          git push origin HEAD:phase-1/completion-gate
