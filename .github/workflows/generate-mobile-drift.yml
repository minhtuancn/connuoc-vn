name: Generate mobile Drift artifacts

on:
  push:
    branches:
      - phase-3/mobile-offline-persistence

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-3/mobile-offline-persistence
          fetch-depth: 0

      - name: Setup Flutter 3.47.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare schema directory
        run: |
          mkdir -p drift_schemas
          rm -f drift_schemas/drift_schema_v1.json drift_schemas/drift_schema_v2.json drift_schemas/version1.sqlite

      - name: Dump current v2 schema
        run: dart run drift_dev schema dump lib/core/database/app_database.dart drift_schemas/

      - name: Create v1 SQLite fixture
        run: dart run tool/create_v1_schema_fixture.dart drift_schemas/version1.sqlite

      - name: Dump v1 schema
        run: dart run drift_dev schema dump drift_schemas/version1.sqlite drift_schemas/drift_schema_v1.json

      - name: Remove temporary v1 SQLite fixture
        if: always()
        run: rm -f drift_schemas/version1.sqlite

      - name: Generate migration schema helper
        run: dart run drift_dev schema steps drift_schemas/ lib/core/database/schema_versions.dart

      - name: Commit generated output
        working-directory: .
        run: |
          set -euo pipefail
          git add apps/mobile/pubspec.lock \
            apps/mobile/lib/core/database/app_database.g.dart \
            apps/mobile/lib/core/database/schema_versions.dart \
            apps/mobile/drift_schemas
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(mobile): generate Drift artifacts'
          git push origin HEAD:phase-3/mobile-offline-persistence
