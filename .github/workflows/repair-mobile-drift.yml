name: Repair mobile Drift artifacts

on:
  push:
    branches:
      - phase-3/mobile-offline-persistence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-3/mobile-offline-persistence
          fetch-depth: 0

      - name: Setup Flutter 3.47.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Format Drift sources
        run: dart format lib/core/database/app_database.dart test/support/app_database_migration_fixture.dart

      - name: Generate Drift Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Commit deterministic artifacts
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mobile/lib/core/database/app_database.dart \
            apps/mobile/lib/core/database/app_database.g.dart \
            apps/mobile/test/support/app_database_migration_fixture.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(mobile): repair Drift generated artifacts'
          git push origin HEAD:phase-3/mobile-offline-persistence
