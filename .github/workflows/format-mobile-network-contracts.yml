name: Format mobile network contracts

on:
  push:
    branches:
      - phase-3/mobile-api-client

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-3/mobile-api-client
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Format network contracts
        working-directory: apps/mobile
        run: dart format lib/core/network/cache_policy.dart lib/features/public_data/domain/public_data_requests.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mobile/lib/core/network/cache_policy.dart apps/mobile/lib/features/public_data/domain/public_data_requests.dart
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(mobile): format network contracts'
          git push origin HEAD:phase-3/mobile-api-client
