name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required foundation documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/PRD.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/TODO.md
            docs/DATA-SOURCES.md
            docs/TIDE-ENGINE.md
            docs/DRAINAGE-ENGINE.md
            docs/LUNAR-CALENDAR.md
            docs/UI-UX.md
            docs/ACCESSIBILITY.md
            docs/OFFLINE.md
            docs/PDF-EXPORT.md
            docs/SECURITY-PRIVACY.md
            docs/TESTING.md
            docs/DEPLOYMENT.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject committed local env files
        shell: bash
        run: |
          set -euo pipefail
          tracked_envs="$(git ls-files '.env' '.env.*' ':!:*.example' || true)"
          if [ -n "$tracked_envs" ]; then
            echo "Tracked environment files are not allowed:"
            echo "$tracked_envs"
            exit 1
          fi

  core-packages:
    name: Core package checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint core packages
        run: pnpm lint

      - name: Typecheck core packages
        run: pnpm typecheck

      - name: Test core packages
        run: pnpm test

      - name: Build core packages
        run: pnpm build

      - name: Tide benchmark smoke
        run: pnpm bench

  database-integration:
    name: PostGIS migration smoke
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: connuoc_test
          POSTGRES_USER: connuoc
          POSTGRES_PASSWORD: connuoc-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connuoc -d connuoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://connuoc:connuoc-ci-only@localhost:5432/connuoc_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply empty-database migrations
        run: pnpm --filter @connuoc/api db:migrate

      - name: Verify PostGIS schema and constraints
        run: pnpm --filter @connuoc/api db:smoke
